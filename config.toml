base_url = "https://docs.baluard.app"
title = "Baluard Docs"
description = "Documentation for Baluard, the Git-native password manager."
default_language = "en"
compile_sass = false
minify_html = false
build_search_index = true

theme = "goyo"

[extra]
enable_custom_css = true
# Site-wide social card, shared with baluard.app (1200x630 brand card).
default_thumbnail = "assets/social-card.png"
# Follow the visitor's OS scheme; the toggle lets them switch at will.
# templates/index.html (site override) resolves matchMedia before paint.
nav = [
    { name = "Home", url = "/", type = "url", icon = "book" },
    { name = "baluard.app", url = "https://baluard.app", type = "url", icon = "house" },
    { name = "GitHub", url = "https://github.com/baluard-org/baluard", type = "url", icon = "github" },
]
# ES labels for the header nav; the theme's menu component reads extra.nav_es
# when the page language is es.
nav_es = [
    { name = "Inicio", url = "/es/", type = "url", icon = "book" },
    { name = "baluard.app", url = "https://baluard.app", type = "url", icon = "house" },
    { name = "GitHub", url = "https://github.com/baluard-org/baluard", type = "url", icon = "github" },
]

[extra.theme]
colorset = "dark"
brightness = "normal"
dark_brightness = "darker"
light_brightness = "normal"

[extra.logo]
text = "Baluard Docs"
image_path = "assets/baluard-logo.svg"

edit_url = "https://github.com/baluard-org/baluard-docs/edit/main"

footer_html = "Part of <a href='https://baluard.app'>baluard.app</a>. Built with <a href='https://www.getzola.org'>Zola</a> and the <a href='https://github.com/hahwul/goyo'>Goyo</a> theme."

[extra.sidebar]
expand_depth = 2

[extra.lang]
# Language display names for the theme's selector.
aliases = { en = "English", es = "Español" }

[languages.es]
build_search_index = true

[languages.es.translations]
errata_section = "Correcciones y actualizaciones"
sidebar_feeds = "Fuentes"
global_feed = "Fuente global"
category_feeds = "Fuentes por categoría"
all_posts = "Todas las publicaciones"
copy = "Copiar"
copied = "¡Copiado!"
failed_to_copy = "Error al copiar"
next = "Siguiente"
back_to = "Volver a"
previous = "Anterior"
edit_page = "Editar esta página"
found_error_alert = "¿Encontraste un error o algo necesita una aclaración?"
open_issue = "Abre un issue en GitHub."
attribution = "Las correcciones fundadas se incorporan con atribución."
found_typo_alert = "¿Encontraste un error tipográfico?"
fork_and_pr = "Haz un fork, modifica y abre un PR."
copy_url_msg = "Copiar URL"
share_on_x = "Compartir en X"
toc_title = "EN ESTA PÁGINA"
